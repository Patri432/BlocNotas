   <script>
    lucide.createIcons();

    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const saveBtn = document.getElementById('save-btn');
    const pencilBtn = document.getElementById('pencil-btn');
    const eraserBtn = document.getElementById('eraser-btn');
    const thicknessSlider = document.getElementById('thickness-slider');
    const colorDots = document.querySelectorAll('.color-dot');
    const greenDot = document.getElementById('green-dot');
    const installBtn = document.getElementById('install-btn');

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      redrawState2();
    }
    window.addEventListener('resize', resizeCanvas);

    const STATE_RECORDING = 1;
    const STATE_FREE = 2;
    const STATE_REVEAL = 3;
    let currentState = STATE_RECORDING;

    let currentColor = '#1C1C1E';
    let currentThickness = 4;
    let isEraser = false;
    let isDrawing = false;

    let savedDrawingData = []; 
    let freeDrawingData = [];  
    let currentStroke = null;
    let strokeStartTime = 0;

    setTimeout(resizeCanvas, 50);

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top,
        t: Date.now()
      };
    }

    function startDrawing(e) {
      if (currentState === STATE_REVEAL) return;
      isDrawing = true;
      const point = getCanvasCoords(e);
      strokeStartTime = point.t;

      currentStroke = {
        color: currentColor,
        thickness: currentThickness,
        isEraser: isEraser,
        startTime: point.t, // Marca de tiempo absoluta de inicio del trazo
        points: [{ x: point.x, y: point.y, t: 0 }]
      };

      ctx.beginPath();
      ctx.moveTo(point.x, point.y);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = isEraser ? '#F8F9FA' : currentColor;
      ctx.lineWidth = currentThickness;
    }

    function draw(e) {
      if (!isDrawing || currentState === STATE_REVEAL) return;
      const point = getCanvasCoords(e);
      const relativeTime = point.t - strokeStartTime;

      if (currentState === STATE_RECORDING) {
        currentStroke.points.push({ x: point.x, y: point.y, t: relativeTime });
      }

      ctx.lineTo(point.x, point.y);
      ctx.stroke();
    }

    function stopDrawing() {
      if (!isDrawing) return;
      isDrawing = false;

      if (currentState === STATE_RECORDING && currentStroke) {
        savedDrawingData.push(currentStroke);
      } else if (currentState === STATE_FREE && currentStroke) {
        freeDrawingData.push(currentStroke);
      }
      currentStroke = null;
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); stopDrawing(); });

    saveBtn.addEventListener('click', () => {
      if (currentState === STATE_RECORDING) {
        currentState = STATE_FREE;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    });

    colorDots.forEach(dot => {
      dot.addEventListener('click', () => {
        colorDots.forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        currentColor = dot.dataset.color;
        isEraser = false;
        pencilBtn.classList.add('active');
        eraserBtn.classList.remove('active');
      });
    });

    pencilBtn.addEventListener('click', () => {
      isEraser = false;
      pencilBtn.classList.add('active');
      eraserBtn.classList.remove('active');
    });

    eraserBtn.addEventListener('click', () => {
      isEraser = true;
      eraserBtn.classList.add('active');
      pencilBtn.classList.remove('active');
    });

    thicknessSlider.addEventListener('input', (e) => {
      currentThickness = e.target.value;
    });

    function redrawState2() {
      if (currentState !== STATE_FREE) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      freeDrawingData.forEach(stroke => {
        if (stroke.points.length === 0) return;
        ctx.beginPath();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = stroke.isEraser ? '#F8F9FA' : stroke.color;
        ctx.lineWidth = stroke.thickness;
        ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < stroke.points.length; i++) {
          ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
        }
        ctx.stroke();
      });
    }

    // DISPARADOR SECRETO (Long Press 2000ms en el botón lápiz)
    let triggerTimer = null;

    function startTriggerHold() {
      if (currentState !== STATE_FREE) return;
      triggerTimer = setTimeout(activateMagicCountdown, 1000);
    }

    function cancelTriggerHold() {
      if (triggerTimer) clearTimeout(triggerTimer);
    }

    pencilBtn.addEventListener('touchstart', startTriggerHold);
    pencilBtn.addEventListener('touchend', cancelTriggerHold);
    pencilBtn.addEventListener('mousedown', startTriggerHold);
    pencilBtn.addEventListener('mouseup', cancelTriggerHold);

    function activateMagicCountdown() {
      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 100]);
      }
      greenDot.classList.add('trigger-active');
      setTimeout(() => {
        executeGhostReveal();
      }, 20000);
    }

    // ESTADO 3: REVELACIÓN FANTASMA CON TIEMPO REAL FIEL AL DIBUJO ORIGINAL
    function executeGhostReveal() {
      currentState = STATE_REVEAL;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (savedDrawingData.length === 0) return;

      // Unificar todos los trazos en un timeline vectorial continuo
      let timelinePoints = [];
      const baseTime = savedDrawingData[0].startTime;

      savedDrawingData.forEach(stroke => {
        const strokeOffset = stroke.startTime - baseTime;
        stroke.points.forEach((pt, index) => {
          timelinePoints.push({
            x: pt.x,
            y: pt.y,
            time: strokeOffset + pt.t,
            color: stroke.color,
            thickness: stroke.thickness,
            isEraser: stroke.isEraser,
            isStart: index === 0
          });
        });
      });

      let animationStartTime = null;
      let pointIndex = 0;

      function renderFrame(timestamp) {
        if (!animationStartTime) animationStartTime = timestamp;
        const elapsedTime = timestamp - animationStartTime;

        while (pointIndex < timelinePoints.length && timelinePoints[pointIndex].time <= elapsedTime) {
          const pt = timelinePoints[pointIndex];

          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = pt.isEraser ? '#F8F9FA' : pt.color;
          ctx.lineWidth = pt.thickness;

          if (pt.isStart || pointIndex === 0) {
            ctx.beginPath();
            ctx.moveTo(pt.x, pt.y);
          } else {
            ctx.lineTo(pt.x, pt.y);
            ctx.stroke();
          }

          pointIndex++;
        }

        if (pointIndex < timelinePoints.length) {
          requestAnimationFrame(renderFrame);
        }
      }

      requestAnimationFrame(renderFrame);
    }

    // REGISTRO SERVICE WORKER PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW activo'))
          .catch(err => console.error('Error SW:', err));
      });
    }

    // MANEJO INSTALACIÓN CHROME
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-block';
    });

    installBtn.addEventListener('click', () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        installBtn.style.display = 'none';
      });
    });
  </script>
