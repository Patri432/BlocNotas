<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="theme-color" content="#F8F9FA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notas">

<link rel="manifest" href="./manifest.json">

<title>Notas</title>

<style>

:root {
    --bg: #F8F9FA;

    --black: #1C1C1E;
    --red: #FF3B30;
    --blue: #007AFF;

    /* Verde normal */
    --green: #34C759;

    /* Verde durante el cronómetro.
       La diferencia es MUY sutil. */
    --green-secret: #31B953;

    --yellow: #FFCC00;

    --panel: rgba(255,255,255,.94);

    --shadow:
        0 5px 20px rgba(0,0,0,.09);

    --safe-top:
        env(safe-area-inset-top, 0px);

    --safe-bottom:
        env(safe-area-inset-bottom, 0px);
}

* {
    box-sizing: border-box;

    margin: 0;
    padding: 0;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: var(--bg);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

body {
    overscroll-behavior: none;
}

button,
input {
    font: inherit;
}


/* ==========================================================
   APP
========================================================== */

#app {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background: var(--bg);
}


/* ==========================================================
   CANVAS
========================================================== */

#canvas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    background: white;

    touch-action: none;
}


/* ==========================================================
   HEADER
========================================================== */

header {

    position: absolute;

    z-index: 20;

    top: 0;
    left: 0;
    right: 0;

    height:
        calc(
            60px +
            var(--safe-top)
        );

    padding:
        var(--safe-top)
        14px
        0;

    display: flex;

    align-items: center;

    justify-content: flex-end;

    pointer-events: none;
}

#save {

    pointer-events: auto;

    border: 0;

    padding: 10px 17px;

    border-radius: 18px;

    background: #007AFF;

    color: white;

    font-size: 14px;

    font-weight: 600;

    box-shadow:
        0 3px 10px rgba(0,0,0,.10);

    transition:
        transform .15s,
        opacity .2s;
}

#save:active {

    transform: scale(.96);
}

#save:disabled {

    opacity: .5;
}


/* ==========================================================
   PALETA
========================================================== */

#palette {

    position: absolute;

    z-index: 20;

    left: 10px;

    top: 50%;

    transform:
        translateY(-50%);

    display: flex;

    flex-direction: column;

    gap: 14px;

    padding: 10px 7px;

    border-radius: 20px;

    background: var(--panel);

    box-shadow: var(--shadow);

    backdrop-filter: blur(12px);

    -webkit-backdrop-filter: blur(12px);
}

.color {

    width: 25px;
    height: 25px;

    padding: 0;

    border: 0;

    border-radius: 50%;

    cursor: pointer;

    position: relative;

    box-shadow:
        0 1px 4px rgba(0,0,0,.15);
}

.color.active::after {

    content: "";

    position: absolute;

    inset: -4px;

    border:
        1.5px solid
        rgba(0,0,0,.28);

    border-radius: 50%;
}


/* Colores */

.black {
    background: var(--black);
}

.red {
    background: var(--red);
}

.blue {
    background: var(--blue);
}

.green {
    background: var(--green);
}

.yellow {
    background: var(--yellow);
}


/*
    ESTE ES EL EFECTO SECRETO.

    Cuando comienza el cronómetro:

    #palette.secret .green

    cambia solamente un poco.
*/

#palette.secret .green {

    background:
        var(--green-secret);
}


/* ==========================================================
   BARRA INFERIOR
========================================================== */

#toolbar {

    position: absolute;

    z-index: 20;

    left: 50%;

    bottom:
        calc(
            14px +
            var(--safe-bottom)
        );

    transform:
        translateX(-50%);

    width:
        min(
            92vw,
            430px
        );

    min-height: 58px;

    padding: 7px 10px;

    display: flex;

    align-items: center;

    gap: 8px;

    border-radius: 30px;

    background: var(--panel);

    box-shadow: var(--shadow);

    backdrop-filter: blur(12px);

    -webkit-backdrop-filter: blur(12px);
}


/* ==========================================================
   BOTONES DE HERRAMIENTA
========================================================== */

.tool {

    width: 44px;
    height: 44px;

    flex: 0 0 44px;

    border: 0;

    border-radius: 50%;

    background: transparent;

    color: #777;

    display: grid;

    place-items: center;

    position: relative;

    touch-action: none;
}

.tool.active {

    color: #007AFF;

    background:
        rgba(0,122,255,.10);
}

.tool svg {

    width: 21px;
    height: 21px;

    fill: none;

    stroke: currentColor;

    stroke-width: 2;

    stroke-linecap: round;

    stroke-linejoin: round;

    pointer-events: none;
}


/* ==========================================================
   SLIDER
========================================================== */

.slider-container {

    flex: 1;

    display: flex;

    align-items: center;

    min-width: 0;
}

#size {

    width: 100%;

    accent-color: #007AFF;
}


/* ==========================================================
   TAMAÑO
========================================================== */

#sizeValue {

    width: 38px;

    text-align: right;

    color: #888;

    font-size: 12px;

    font-variant-numeric:
        tabular-nums;
}


/* ==========================================================
   INDICADOR SECRETO
========================================================== */

#secretIndicator {

    position: absolute;

    z-index: 30;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%,-50%);

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0);

    pointer-events: none;

    opacity: 0;

    transition:
        opacity .2s;
}


/*
    NO mostramos ningún contador.

    Este elemento solamente sirve
    para lógica interna.
*/

#secretIndicator.active {

    opacity: 0;
}


/* ==========================================================
   TOAST
========================================================== */

#toast {

    position: absolute;

    z-index: 40;

    left: 50%;

    bottom:
        calc(
            88px +
            var(--safe-bottom)
        );

    transform:
        translate(-50%,10px);

    opacity: 0;

    padding:
        8px 13px;

    border-radius: 12px;

    background:
        rgba(30,30,32,.88);

    color: white;

    font-size: 12px;

    pointer-events: none;

    transition:
        opacity .2s,
        transform .2s;
}

#toast.show {

    opacity: 1;

    transform:
        translate(-50%,0);
}


/* ==========================================================
   RESPONSIVE
========================================================== */

@media (max-width:380px) {

    #palette {
        left: 7px;
    }

    .color {
        width: 23px;
        height: 23px;
    }

    #toolbar {

        width:
            calc(
                100vw - 82px
            );
    }
}

</style>
</head>


<body>

<div id="app">


    <!-- ======================================================

    <!-- ======================================================

    <!-- ======================================================

        </button>

        </button>

            data-color="#FFCC00">
        </button>

    </div>

         BARRA
    ======================================================= -->

    <div id="toolbar">


        <!-- LÁPIZ -->

        <button
            id="pencil"
            class="tool active"
            aria-label="Lápiz">

            <svg viewBox="0 0 24 24">

        <!-- GOMA -->

        <button
            id="eraser"
            class="tool"
            aria-label="Goma">

                    11.7-11.7

                    L17.7 4.3

                    L2 16

                </path>

        <!-- GROSOR -->

        <div class="slider-container">

            <input
                id="size"
                type="range"
                min="1"

        </span>

    <!-- TOAST -->

    <div id="toast"></div>

</div>


<script>

"use strict";


/* ==========================================================
   ELEMENTOS
========================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


const saveButton =
    document.getElementById("save");

const pencil =
    document.getElementById("pencil");

const eraser =
    document.getElementById("eraser");

const palette =
    document.getElementById("palette");

const sizeSlider =
    document.getElementById("size");

const sizeValue =
    document.getElementById("sizeValue");

const toast =
    document.getElementById("toast");


const colors =
    document.querySelectorAll(".color");


/* ==========================================================
   ESTADOS
========================================================== */

const RECORDING =
    1;

const FREE_DRAW =
    2;

const REVEAL =
    3;


let state =
    RECORDING;


/* ==========================================================
   HERRAMIENTA
========================================================== */

let currentColor =
    "#1C1C1E";

let currentSize =
    4;

let erasing =
    false;


/* ==========================================================
   DATOS DEL DIBUJO
========================================================== */

/*
    Esta variable contiene
    el dibujo secreto.

    Ejemplo:

    [
        {
            color: "#1C1C1E",
            thickness: 4,
            isEraser: false,
            points: [
                {
                    x: 100,
                    y: 200,
                    t: 0
                },
                ...
            ]
        }
    ]
*/

let savedDrawingData =
    [];


/* ==========================================================
   VIDEO
========================================================== */

/*
    MUY IMPORTANTE:

    NO grabamos la pantalla.

    Grabamos únicamente:

        canvas.captureStream()

    Por tanto el vídeo contiene
    exclusivamente lo que aparece
    dentro del canvas.
*/

let mediaRecorder =
    null;

let recordedChunks =
    [];

let recordedVideoBlob =
    null;


/* ==========================================================
   GRABACIÓN DEL CANVAS
========================================================== */

function startCanvasVideoRecording() {

    /*
        Algunos navegadores móviles
        no soportan MediaRecorder.
    */

    if (
        !canvas.captureStream ||
        !window.MediaRecorder
    ) {

        console.warn(
            "MediaRecorder no disponible"
        );

        return;

    }


    try {

        const stream =
            canvas.captureStream(30);


        let mimeType =
            "";


        /*
            Elegimos el formato disponible.
        */

        if (
            MediaRecorder.isTypeSupported(
                "video/webm;codecs=vp9"
            )
        ) {

            mimeType =
                "video/webm;codecs=vp9";

        }

        else if (
            MediaRecorder.isTypeSupported(
                "video/webm;codecs=vp8"
            )
        ) {

            mimeType =
                "video/webm;codecs=vp8";

        }

        else if (
            MediaRecorder.isTypeSupported(
                "video/webm"
            )
        ) {

            mimeType =
                "video/webm";

        }


        mediaRecorder =
            mimeType

                ? new MediaRecorder(
                    stream,
                    {
                        mimeType,
                        videoBitsPerSecond:
                            2500000
                    }
                )

                : new MediaRecorder(
                    stream
                );


        recordedChunks =
            [];


        mediaRecorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    recordedChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            () => {

                recordedVideoBlob =
                    new Blob(
                        recordedChunks,
                        {
                            type:
                                mediaRecorder.mimeType ||
                                "video/webm"
                        }
                    );


                console.log(
                    "Vídeo guardado:",
                    recordedVideoBlob.size,
                    "bytes"
                );

            };


        mediaRecorder.start(
            100
        );


        console.log(
            "Grabación del canvas iniciada"
        );

    }

    catch(error) {

        console.error(
            "No se pudo iniciar la grabación:",
            error
        );

    }

}


/* ==========================================================
   PARAR VÍDEO
========================================================== */

function stopCanvasVideoRecording() {

    return new Promise(
        resolve => {

            if (
                !mediaRecorder ||
                mediaRecorder.state ===
                    "inactive"
            ) {

                resolve();
                return;

            }


            mediaRecorder.onstop =
                () => {

                    recordedVideoBlob =
                        new Blob(
                            recordedChunks,
                            {
                                type:
                                    mediaRecorder.mimeType ||
                                    "video/webm"
                            }
                        );


                    console.log(
                        "Vídeo final guardado:",
                        recordedVideoBlob.size,
                        "bytes"
                    );


                    resolve();

                };


            mediaRecorder.stop();

        }
    );

}


/* ==========================================================
   CANVAS RESIZE
========================================================== */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    const dpr =
        Math.max(
            1,
            Math.min(
                window.devicePixelRatio || 1,
                3
            )
        );


    canvas.width =
        Math.round(
            rect.width * dpr
        );

    canvas.height =
        Math.round(
            rect.height * dpr
        );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    /*
        Fondo blanco.

        El vídeo también tendrá
        fondo blanco.
    */

    ctx.fillStyle =
        "white";

    ctx.fillRect(
        0,
        0,
        rect.width,
        rect.height
    );

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* ==========================================================
   COORDENADAS
========================================================== */

function getPoint(event) {

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            event.clientX -
            rect.left,

        y:
            event.clientY -
            rect.top

    };

}


/* ==========================================================
   PINTAR PUNTO
========================================================== */

function drawPoint(
    point,
    stroke
) {

    ctx.save();


    if (
        stroke.isEraser
    ) {

        ctx.globalCompositeOperation =
            "destination-out";

    }

    else {

        ctx.globalCompositeOperation =
            "source-over";

    }


    ctx.fillStyle =
        stroke.color;

    ctx.beginPath();

    ctx.arc(
        point.x,
        point.y,
        Math.max(
            stroke.thickness / 2,
            0.5
        ),
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

}


/* ==========================================================
   PINTAR LÍNEA
========================================================== */

function drawLine(
    a,
    b,
    stroke
) {

    ctx.save();


    if (
        stroke.isEraser
    ) {

        ctx.globalCompositeOperation =
            "destination-out";

    }

    else {

        ctx.globalCompositeOperation =
            "source-over";

    }


    ctx.strokeStyle =
        stroke.color;

    ctx.lineWidth =
        stroke.thickness;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    ctx.beginPath();

    ctx.moveTo(
        a.x,
        a.y
    );

    ctx.lineTo(
        b.x,
        b.y
    );

    ctx.stroke();


    ctx.restore();

}


/* ==========================================================
   DIBUJO
========================================================== */

let drawing =
    false;

let currentStroke =
    null;

let recordingStart =
    null;


canvas.addEventListener(
    "pointerdown",
    event => {

        if (
            state === REVEAL
        ) {
            return;
        }


        event.preventDefault();


        drawing =
            true;


        const point =
            getPoint(event);


        /*
            Primer punto del tiempo
            absoluto de la grabación.
        */

        if (
            state === RECORDING &&
            recordingStart === null
        ) {

            recordingStart =
                performance.now();

        }


        currentStroke = {

            color:
                currentColor,

            thickness:
                currentSize,

            isEraser:
                erasing,

            points: [

                {

                    x:
                        point.x,

                    y:
                        point.y,

                    t:
                        state === RECORDING

                            ? performance.now() -
                              recordingStart

                            : 0

                }

            ]

        };


        drawPoint(
            point,
            currentStroke
        );


        try {

            canvas.setPointerCapture(
                event.pointerId
            );

        } catch (_) {}

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (
            !drawing ||
            !currentStroke ||
            state === REVEAL
        ) {
            return;
        }


        event.preventDefault();


        const point =
            getPoint(event);


        const previous =
            currentStroke.points[
                currentStroke.points.length - 1
            ];


        currentStroke.points.push({

            x:
                point.x,

            y:
                point.y,

            t:
                state === RECORDING

                    ? performance.now() -
                      recordingStart

                    : 0

        });


        drawLine(
            previous,
            point,
            currentStroke
        );

    },
    {
        passive: false
    }
);


function finishDrawing(event) {

    if (!drawing) {
        return;
    }


    drawing =
        false;


    /*
        SOLO FASE 1.

        En FASE 2 no se almacena.
    */

    if (
        state === RECORDING &&
        currentStroke
    ) {

        savedDrawingData.push(
            currentStroke
        );

    }


    currentStroke =
        null;


    try {

        canvas.releasePointerCapture(
            event.pointerId
        );

    } catch (_) {}

}


canvas.addEventListener(
    "pointerup",
    finishDrawing
);

canvas.addEventListener(
    "pointercancel",
    finishDrawing
);


/* ==========================================================
   COLORES
========================================================== */

colors.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                if (
                    state === REVEAL
                ) {
                    return;
                }


                currentColor =
                    button.dataset.color;


                erasing =
                    false;


                pencil.classList.add(
                    "active"
                );

                eraser.classList.remove(
                    "active"
                );


                colors.forEach(
                    c =>
                        c.classList.remove(
                            "active"
                        )
                );


                button.classList.add(
                    "active"
                );

            }
        );

    }
);


/* ==========================================================
   LÁPIZ
========================================================== */

function usePencil() {

    if (
        state === REVEAL
    ) {
        return;
    }


    erasing =
        false;


    pencil.classList.add(
        "active"
    );

    eraser.classList.remove(
        "active"
    );

}


/* ==========================================================
   GOMA
========================================================== */

function useEraser() {

    if (
        state === REVEAL
    ) {
        return;
    }


    erasing =
        true;


    eraser.classList.add(
        "active"
    );

    pencil.classList.remove(
        "active"
    );

}


/* ==========================================================
   CLICK NORMAL
========================================================== */

let ignoreNextPencilClick =
    false;


pencil.addEventListener(
    "click",
    () => {

        if (
            ignoreNextPencilClick
        ) {

            ignoreNextPencilClick =
                false;

            return;

        }


        usePencil();

    }
);


eraser.addEventListener(
    "click",
    () => {

        useEraser();

    }
);


/* ==========================================================
   GROSOR
========================================================== */

sizeSlider.addEventListener(
    "input",
    event => {

        currentSize =
            Number(
                event.target.value
            );


        sizeValue.textContent =
            `${currentSize} px`;

    }
);


/* ==========================================================
   GUARDAR
========================================================== */

saveButton.addEventListener(
    "click",
    async () => {

        if (
            state !== RECORDING
        ) {
            return;
        }


        if (
            savedDrawingData.length === 0
        ) {

            showToast(
                "Dibuja algo primero"
            );

            return;

        }


        saveButton.disabled =
            true;


        saveButton.textContent =
            "Guardando...";


        /*
            DETENEMOS EL VÍDEO.

            Aquí ya tenemos:

            1. savedDrawingData
            2. recordedVideoBlob
        */

        await stopCanvasVideoRecording();


        /*
            Pasamos a FASE 2.
        */

        state =
            FREE_DRAW;


        /*
            La pantalla se vuelve
            completamente blanca.
        */

        clearCanvas();


        /*
            Importante:

            El dibujo y el vídeo siguen
            guardados en memoria.
        */

        saveButton.textContent =
            "Guardado";


        showToast(
            "Guardado"
        );

    }
);


/* ==========================================================
   LIMPIAR
========================================================== */

function clearCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    ctx.save();

    ctx.globalCompositeOperation =
        "source-over";


    ctx.fillStyle =
        "white";


    ctx.fillRect(
        0,
        0,
        rect.width,
        rect.height
    );


    ctx.restore();

}


/* ==========================================================
   TRIGGER SECRETO
========================================================== */

let longPressTimer =
    null;

let secretCountdownTimer =
    null;


function startSecretPress() {

    if (
        state !== FREE_DRAW
    ) {
        return;
    }


    clearTimeout(
        longPressTimer
    );


    /*
        EXACTAMENTE 2 segundos
        manteniendo pulsado.
    */

    longPressTimer =
        setTimeout(
            () => {

                ignoreNextPencilClick =
                    true;


                activateSecretTrigger();

            },

            2000
        );

}


function cancelSecretPress() {

    clearTimeout(
        longPressTimer
    );

    longPressTimer =
        null;

}


/* ==========================================================
   PULSACIÓN LARGA DEL LÁPIZ
========================================================== */

pencil.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        startSecretPress();

    },
    {
        passive: false
    }
);


pencil.addEventListener(
    "pointerup",
    cancelSecretPress
);


pencil.addEventListener(
    "pointercancel",
    cancelSecretPress
);


pencil.addEventListener(
    "pointerleave",
    cancelSecretPress
);


/* ==========================================================
   ACTIVAR CRONÓMETRO
========================================================== */

function activateSecretTrigger() {

    if (
        state !== FREE_DRAW ||
        secretCountdownTimer !== null
    ) {
        return;
    }


    /*
        CAMBIO DE COLOR.

        Es la única confirmación visual
        para el mago.
    */

    palette.classList.add(
        "secret"
    );


    /*
        Vibración muy ligera.
    */

    if (
        navigator.vibrate
    ) {

        try {

            navigator.vibrate(
                35
            );

        } catch (_) {}

    }


    /*
        CRONÓMETRO INVISIBLE.

        No aparece ningún número
        en pantalla.
    */

    const endTime =
        performance.now() +
        5000;


    secretCountdownTimer =
        setInterval(
            () => {

                if (
                    performance.now() >=
                    endTime
                ) {

                    clearInterval(
                        secretCountdownTimer
                    );


                    secretCountdownTimer =
                        null;


                    /*
                        RESTAURAMOS EL VERDE.
                    */

                    palette.classList.remove(
                        "secret"
                    );


                    /*
                        PASAMOS A REVELACIÓN.
                    */

                    revealVideo();

                }

            },

            20
        );

}


/* ==========================================================
   REPRODUCIR VÍDEO
========================================================== */

function revealVideo() {

    state =
        REVEAL;


    /*
        Quitamos herramientas
        funcionalmente.
    */

    saveButton.style.display =
        "none";

    palette.style.display =
        "none";

    document.getElementById(
        "toolbar"
    ).style.display =
        "none";


    /*
        Borramos el canvas.
    */

    clearCanvas();


    /*
        Si por alguna razón
        el vídeo no está disponible,
        usamos la reproducción vectorial
        como respaldo.
    */

    if (
        !recordedVideoBlob
    ) {

        revealVectorDrawing();

        return;

    }


    /*
        Creamos un vídeo temporal.
    */

    const video =
        document.createElement(
            "video"
        );


    video.muted =
        true;

    video.playsInline =
        true;

    video.autoplay =
        true;


    video.style.position =
        "absolute";

    video.style.inset =
        "0";

    video.style.width =
        "100%";

    video.style.height =
        "100%";

    video.style.objectFit =
        "fill";

    video.style.zIndex =
        "10";

    video.style.background =
        "white";


    const videoURL =
        URL.createObjectURL(
            recordedVideoBlob
        );


    video.src =
        videoURL;


    document
        .getElementById("app")
        .appendChild(video);


    video.addEventListener(
        "ended",
        () => {

            URL.revokeObjectURL(
                videoURL
            );

        }
    );


    video.play()
        .catch(
            error => {

                console.warn(
                    "No se pudo reproducir el vídeo:",
                    error
                );


                /*
                    Respaldo vectorial.
                */

                video.remove();

                revealVectorDrawing();

            }
        );

}


/* ==========================================================
   REVELACIÓN VECTORIAL DE RESPALDO
========================================================== */

let revealStart =
    0;

let revealStroke =
    0;

let revealPoint =
    0;


function revealVectorDrawing() {

    clearCanvas();


    revealStart =
        performance.now();

    revealStroke =
        0;

    revealPoint =
        0;


    requestAnimationFrame(
        revealFrame
    );

}


function revealFrame(
    now
) {

    const elapsed =
        now -
        revealStart;


    while (
        revealStroke <
        savedDrawingData.length
    ) {

        const stroke =
            savedDrawingData[
                revealStroke
            ];


        const points =
            stroke.points;


        while (

            revealPoint <
            points.length &&

            points[
                revealPoint
            ].t <= elapsed

        ) {

            if (
                revealPoint === 0
            ) {

                drawPoint(
                    points[0],
                    stroke
                );

            }

            else {

                drawLine(
                    points[
                        revealPoint - 1
                    ],

                    points[
                        revealPoint
                    ],

                    stroke
                );

            }


            revealPoint++;

        }


        if (
            revealPoint <
            points.length
        ) {

            break;

        }


        revealStroke++;

        revealPoint =
            0;

    }


    if (
        revealStroke <
        savedDrawingData.length
    ) {

        requestAnimationFrame(
            revealFrame
        );

    }

}


/* ==========================================================
   TOAST
========================================================== */

function showToast(
    message
) {

    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        showToast.timer
    );


    showToast.timer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },

            1400
        );

}
